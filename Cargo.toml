[package]
name = "roku-remote"
version = "0.4.0"
edition = "2024"
license = "MIT"

[dependencies]
eframe = { version = "=0.36.2", default-features = false, features = ["glow", "default_fonts"] }
# Channel logos: the TV serves them as WebP, PNG or JPEG.
egui_extras = { version = "=0.36.2", default-features = false, features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
# Sharing a folder: SSDP needs port 1900 shared with other programs.
socket2 = { version = "0.6", features = ["all"] }

# Linux/BSD desktop backends: native Wayland + X11 windows.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
eframe = { version = "=0.36.2", default-features = false, features = ["wayland", "x11"] }

# Desktop media controls (MPRIS) over D-Bus.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
async-io = "2"
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }

# Folder picker (Linux uses the desktop portal over zbus).
[target.'cfg(windows)'.dependencies]
rfd = { version = "0.15", default-features = false }

# Embeds the icon in the Windows .exe.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
