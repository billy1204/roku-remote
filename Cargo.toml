[package]
name = "roku-remote"
version = "0.1.1"
edition = "2024"
license = "MIT"

[dependencies]
eframe = { version = "=0.36.2", default-features = false, features = ["glow", "default_fonts"] }

# Linux/BSD desktop backends: native Wayland + X11 windows.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
eframe = { version = "=0.36.2", default-features = false, features = ["wayland", "x11"] }

# Embeds the icon in the Windows .exe.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
