name: Windows build

# Builds roku-remote.exe on Windows and attaches it to the release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the .exe to
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - run: cargo build --release --locked
      - name: Attach to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp target/release/roku-remote.exe Roku-Remote-windows-x86_64.exe
          gh release upload "$TAG" Roku-Remote-windows-x86_64.exe --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: Roku-Remote-windows-x86_64
          path: Roku-Remote-windows-x86_64.exe
