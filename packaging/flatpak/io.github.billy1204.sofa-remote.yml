id: io.github.billy1204.sofa-remote
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: sofa-remote
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Finds and controls the TV, and serves shared media to it.
  - --share=network
  # Media keys and the desktop's player controls.
  - --own-name=org.mpris.MediaPlayer2.sofa_remote
  # Tray icon.
  - --talk-name=org.kde.StatusNotifierWatcher
modules:
  - name: sofa-remote
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/sofa-remote/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo build --release --locked --offline
      - install -Dm755 target/release/sofa-remote -t ${FLATPAK_DEST}/bin
      - install -Dm644 packaging/io.github.billy1204.sofa-remote.desktop -t ${FLATPAK_DEST}/share/applications
      - install -Dm644 packaging/io.github.billy1204.sofa-remote.metainfo.xml -t ${FLATPAK_DEST}/share/metainfo
      - install -Dm644 assets/icon.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/io.github.billy1204.sofa-remote.svg
      - install -Dm644 assets/icon.png ${FLATPAK_DEST}/share/icons/hicolor/256x256/apps/io.github.billy1204.sofa-remote.png
      - install -Dm644 THIRD-PARTY-LICENSES.md -t ${FLATPAK_DEST}/share/licenses/io.github.billy1204.sofa-remote
    sources:
      - type: git
        url: https://github.com/billy1204/sofa-remote.git
        tag: v0.10.1
        commit: 2147b59e600ff02a931c368d176f4ef567de0381
      - cargo-sources.json
